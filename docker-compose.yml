version: '3.8'

services:
  # Spring Boot Java 21 REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ewaste-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Inject Atlas Cloud connection string or fall back to docker network mongodb
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/ewaste_db}
      - SERVER_PORT=8081
    depends_on:
      - mongodb
    networks:
      - ewaste-network

  # React Vite Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ewaste-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ewaste-network

  # Local MongoDB fallback container (used when MONGODB_URI is not set to Atlas)
  mongodb:
    image: mongo:7.0
    container_name: ewaste-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ewaste-network

networks:
  ewaste-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
