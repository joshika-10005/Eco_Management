apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secret
  namespace: ewaste-system
type: Opaque
stringData:
  # Base64 encoded or stringData MongoDB Atlas connection string
  # Replace with: mongodb+srv://<username>:<password>@cluster0.mongodb.net/ewaste_db?retryWrites=true&w=majority
  MONGODB_URI: "mongodb+srv://<ATLAS_USERNAME>:<ATLAS_PASSWORD>@cluster0.mongodb.net/ewaste_db?retryWrites=true&w=majority"
