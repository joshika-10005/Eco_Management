apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ewaste-ingress
  namespace: ewaste-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: ewaste.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ewaste-backend-service
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ewaste-frontend-service
                port:
                  number: 80
