server.port=8081

# Application Details
spring.application.name=ewaste-management-backend

# MongoDB Atlas Configuration via Environment Variable
# NEVER HARDCODE CREDENTIALS: Pass MONGODB_URI via Environment Variable
# Example Atlas format: mongodb+srv://<username>:<password>@cluster0.mongodb.net/ewaste_db?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ewaste_db}

# Auto-index creation in collections
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.ewaste=DEBUG
